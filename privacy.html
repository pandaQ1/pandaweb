<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>隐私政策 — Panda 插件中心</title>
  <meta name="description" content="每个 Panda 扩展的隐私政策：数据存储位置、联网场景、权限用途与第三方服务说明。" />
  <link rel="icon" type="image/png" href="assets/icons/icon128.png" />
  <link rel="stylesheet" href="assets/style.css" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('site-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="container" style="padding:72px 24px">
      <h1 style="font-size:28px;font-weight:700">隐私政策</h1>
      <p style="color:var(--text-sub);margin-top:12px">正在加载…</p>
    </div>
  </div>

  <script src="assets/plugins.data.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/privacy.js"></script>
</body>
</html>
