<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panda 插件中心 — 全部插件下载与安装</title>
  <meta name="description" content="Panda 浏览器扩展合集：生词高亮 & 翻译助手、视频控制 & 录屏截图、哔哩哔哩助手、B 站视频下载器。每个插件都有独立介绍、下载安装与隐私政策。" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" href="assets/icons/icon128.png" />
  <link rel="stylesheet" href="assets/style.css" />
  <script>
    /* 防主题闪烁：在首次绘制前定好主题 */
    (function () {
      try {
        var t = localStorage.getItem('site-theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div id="app">
    <!-- JS 渲染前的静态兜底 -->
    <div class="container" style="padding:72px 24px">
      <h1 style="font-size:30px;font-weight:700;letter-spacing:-.02em">Panda 插件中心</h1>
      <p style="color:var(--text-sub);margin-top:12px">正在加载插件列表…</p>
      <p style="color:var(--text-faint);font-size:13px;margin-top:10px">
        若长时间空白，请运行 <code>node tools/build.mjs</code> 生成 <code>assets/plugins.data.js</code>。
      </p>
    </div>
  </div>
  <noscript>
    <div class="container" style="padding:40px 24px">
      <p>本站需要启用 JavaScript 才能切换插件与显示下载信息。</p>
      <p>安装包清单见 <a class="inline-link" href="downloads/README.md">downloads/README.md</a>。</p>
    </div>
  </noscript>

  <script src="assets/plugins.data.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
